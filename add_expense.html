<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KrysPI | Add Expense</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                class="brand-logo"
                alt="KrysPI Logo"
            >

            <div>
                <div class="brand-name">KrysPI</div>
                <div class="brand-motto">
                    Track. Plan. Spend Smarter.
                </div>
            </div>

        </div>

        <nav>

            <a href="/dashboard" class="nav-link">
                🏠 Dashboard
            </a>

            <a href="/add-expense" class="nav-link active">
                ➕ Add Expense
            </a>

            <a href="/expense-history" class="nav-link">
                📋 Expense History
            </a>

            <a href="/analytics" class="nav-link">
                📊 Analytics
            </a>

            <a href="/budget" class="nav-link">
                💰 Budget
            </a>

            <a href="/savings" class="nav-link">
                🎯 Savings
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="current-user">
                👤 {{ user }}
            </div>

            <a href="/switch-user" class="switch-user">
                ⇄ Switch User
            </a>

        </div>

    </aside>


    <main class="main-content">

        <section class="hero">

            <p class="eyebrow">
                EXPENSE TRACKING
            </p>

            <h1>
                Add an Expense 💳
            </h1>

            <p>
                Bought something you definitely needed?
                👀 Add it here.
            </p>

        </section>


        <section class="form-card">

            <form action="/add-expense" method="POST">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <div class="input-with-symbol">
                            <span>₹</span>

                            <input
                                type="number"
                                id="amount"
                                name="amount"
                                placeholder="250"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            required
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="What did you spend on?"
                            rows="4"
                        ></textarea>

                    </div>

                </div>


                <button type="submit" class="primary-button">
                    Add Expense →
                </button>

            </form>

        </section>


        <footer class="site-footer">

            <strong>
                Made by Krimsi Shah, 2026
            </strong>

            <span>
                Email: krimsshah@gmail.com
            </span>

        </footer>

    </main>

</body>

</html>
